spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: wechat-jsapi-store
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wechat_store}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=15000&tcpKeepAlive=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:1000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      keepalive-time: ${DB_KEEPALIVE_TIME:300000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

wxpay:
  app-id: ${WECHAT_PAY_APP_ID}
  mch-id: ${WECHAT_PAY_MCH_ID}
  api-v3-key: ${WECHAT_PAY_API_V3_KEY}
  private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH}
  merchant-serial-number: ${WECHAT_PAY_SERIAL_NO}
  notify-url: ${WECHAT_PAY_NOTIFY_URL}

wx:
  mp:
    app-id: ${WECHAT_MP_APP_ID}
    secret: ${WECHAT_MP_SECRET}
    token: ${WECHAT_MP_TOKEN:}
    aes-key: ${WECHAT_MP_AES_KEY:}
    oauth-callback-url: ${WECHAT_MP_OAUTH_CALLBACK_URL}

h5:
  auth:
    cookie-name: WECHAT_STORE_H5_TOKEN
    token-secret: ${JWT_SECRET}
    ttl-seconds: ${H5_AUTH_TTL_SECONDS:604800}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    base-dir: ${UPLOAD_BASE_DIR:./uploads}
    public-prefix: /uploads
    max-size: 5MB
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    header-name: X-Admin-Token
    token-secret: ${ADMIN_TOKEN_SECRET}
    ttl-seconds: ${ADMIN_TOKEN_TTL_SECONDS:604800}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /doc.html
